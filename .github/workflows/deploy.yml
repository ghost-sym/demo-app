# Build apps/api + apps/worker + apps/web -> push to private ACR -> roll the
# `api`, `worker` and `web` Container Apps. Runs on the jumpbox VM (self-hosted,
# label `jumpbox`) inside shyam-vnet, so it reaches shyamdemoacr.azurecr.io over
# the private endpoint.
# Auth is GitHub OIDC: the job's id-token is exchanged for an Azure token as the
# `shyam-github-deploy` federated identity (AcrPush on the registry, Contributor
# on `api`, `worker` + `web`, Reader on the RG). No secrets stored anywhere —
# AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID are repo variables.
name: Deploy api + worker + web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # request the OIDC token
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  RESOURCE_GROUP: shyam-rg
  ACR_NAME: shyamdemoacr

jobs:
  deploy:
    runs-on: [self-hosted, jumpbox]
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login + CLI extension
        run: |
          az extension add --name containerapp --upgrade --yes --only-show-errors
          az acr login -n "$ACR_NAME"

      # Each image is tagged with the full commit SHA (what gets deployed, so a
      # revision maps 1:1 to a commit) and with :latest (moved to this push).
      - name: Resolve image tags + API URL
        run: |
          login_server=$(az acr show -n "$ACR_NAME" --query loginServer -o tsv)
          tag=${GITHUB_SHA}
          echo "LOGIN_SERVER=${login_server}" >> "$GITHUB_ENV"
          api_fqdn=$(az containerapp show -n api -g "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "API_IMAGE=${login_server}/demo-app/api:${tag}" >> "$GITHUB_ENV"
          echo "WORKER_IMAGE=${login_server}/demo-app/worker:${tag}" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=${login_server}/demo-app/web:${tag}" >> "$GITHUB_ENV"
          echo "VITE_API_BASE=https://${api_fqdn}/api" >> "$GITHUB_ENV"

      # --- api ---------------------------------------------------------------
      - name: Build + push api
        run: |
          docker build -t "$API_IMAGE" -t "$LOGIN_SERVER/demo-app/api:latest" apps/api
          docker push "$API_IMAGE"
          docker push "$LOGIN_SERVER/demo-app/api:latest"

      - name: Deploy api
        run: az containerapp update -n api -g "$RESOURCE_GROUP" --image "$API_IMAGE" --output none

      # --- worker --------------------------------------------------------------
      - name: Build + push worker
        run: |
          docker build -t "$WORKER_IMAGE" -t "$LOGIN_SERVER/demo-app/worker:latest" apps/worker
          docker push "$WORKER_IMAGE"
          docker push "$LOGIN_SERVER/demo-app/worker:latest"

      - name: Deploy worker
        run: az containerapp update -n worker -g "$RESOURCE_GROUP" --image "$WORKER_IMAGE" --output none

      # --- web (API URL is baked in at build time) ---------------------------
      - name: Build + push web
        run: |
          docker build --build-arg VITE_API_BASE="$VITE_API_BASE" \
            -t "$WEB_IMAGE" -t "$LOGIN_SERVER/demo-app/web:latest" apps/web
          docker push "$WEB_IMAGE"
          docker push "$LOGIN_SERVER/demo-app/web:latest"

      - name: Deploy web
        run: |
          az containerapp update -n web -g "$RESOURCE_GROUP" --image "$WEB_IMAGE" --output none
          echo "Live: https://$(az containerapp show -n web -g "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)"

      - name: Clean up images + registry login
        if: always()
        run: |
          docker image rm "$API_IMAGE" "$WORKER_IMAGE" "$WEB_IMAGE" \
            "$LOGIN_SERVER/demo-app/api:latest" "$LOGIN_SERVER/demo-app/worker:latest" \
            "$LOGIN_SERVER/demo-app/web:latest" 2>/dev/null || true
          # Runner is persistent: don't leave the ACR token in ~/.docker/config.json.
          docker logout "$LOGIN_SERVER" || true
