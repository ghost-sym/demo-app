# Build apps/api + apps/worker + apps/web -> push to private ACR -> roll the
# `api`, `worker` and `web` Container Apps. Runs on the jumpbox VM (self-hosted,
# label `jumpbox`) inside shyam-vnet, so it reaches ShyamDemo.azurecr.io over
# the private endpoint.
# Auth is the VM's managed identity (AcrPush on the registry, Contributor on
# `api`, `worker` + `web`, Reader on the RG) — no secrets stored in GitHub.
name: Deploy api + worker + web

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  RESOURCE_GROUP: shyam-rg
  ACR_NAME: ShyamDemo

jobs:
  deploy:
    runs-on: [self-hosted, jumpbox]
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (managed identity)
        run: |
          az login --identity --output none
          az extension add --name containerapp --upgrade --yes --only-show-errors
          az acr login -n "$ACR_NAME"

      - name: Resolve image tags + API URL
        run: |
          login_server=$(az acr show -n "$ACR_NAME" --query loginServer -o tsv)
          tag=${GITHUB_SHA::7}
          api_fqdn=$(az containerapp show -n api -g "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "API_IMAGE=${login_server}/demo-api:${tag}" >> "$GITHUB_ENV"
          echo "WORKER_IMAGE=${login_server}/demo-worker:${tag}" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=${login_server}/demo-web:${tag}" >> "$GITHUB_ENV"
          echo "VITE_API_BASE=https://${api_fqdn}/api" >> "$GITHUB_ENV"

      # --- api ---------------------------------------------------------------
      - name: Build + push api
        run: |
          docker build -t "$API_IMAGE" apps/api
          docker push "$API_IMAGE"

      - name: Deploy api
        run: az containerapp update -n api -g "$RESOURCE_GROUP" --image "$API_IMAGE" --output none

      # --- worker --------------------------------------------------------------
      - name: Build + push worker
        run: |
          docker build -t "$WORKER_IMAGE" apps/worker
          docker push "$WORKER_IMAGE"

      - name: Deploy worker
        run: az containerapp update -n worker -g "$RESOURCE_GROUP" --image "$WORKER_IMAGE" --output none

      # --- web (API URL is baked in at build time) ---------------------------
      - name: Build + push web
        run: |
          docker build --build-arg VITE_API_BASE="$VITE_API_BASE" -t "$WEB_IMAGE" apps/web
          docker push "$WEB_IMAGE"

      - name: Deploy web
        run: |
          az containerapp update -n web -g "$RESOURCE_GROUP" --image "$WEB_IMAGE" --output none
          echo "Live: https://$(az containerapp show -n web -g "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)"

      - name: Clean up local images
        if: always()
        run: docker image rm "$API_IMAGE" "$WORKER_IMAGE" "$WEB_IMAGE" 2>/dev/null || true
